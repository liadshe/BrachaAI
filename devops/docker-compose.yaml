services:
  mongodb:
    image: mongo:7.0
    container_name: bracha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db 
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bracha-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=mongodb://admin:secretpassword@mongodb:27017/bracha?authSource=admin
      - OPENAI_API_KEY=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
    depends_on:
      - mongodb

volumes:
  mongo_data: